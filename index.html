<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="LovelyCarve 插件的版本、插件包与 SHA-256，在桌面版中一键安装。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f4f0">
    <title>LovelyCarve 插件市场</title>
    <link rel="icon" href="./assets/32x32.png" type="image/png">
    <script>
      // Theme and motion before the first paint, as the desktop app sets them before mount:
      // the saved theme, else the system appearance; motion off when the system asks for less.
      (() => {
        const root = document.documentElement;
        let saved = null;
        try { saved = localStorage.getItem('lovelycarve-theme'); } catch { /* storage may be blocked */ }
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main>
        <h1>LovelyCarve 插件市场</h1>
        <p>插件包的下载地址与 SHA-256 见<a href="./index.json">插件索引</a>。</p>
        <p lang="en">Package downloads and SHA-256 digests are listed in the <a href="./index.json">plugin index</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
